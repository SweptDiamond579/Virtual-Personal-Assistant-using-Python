[project]
name = "jarvis-api"
version = "0.1.0"
description = "JARVIS OS backend: orchestrator, tools, memory, voice, workflows and integrations"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.162",
  "uvicorn[standard]>=0.38",
  "pydantic>=2.14",
  "pydantic-settings>=2.11",
  "sqlalchemy[asyncio]>=2.1",
  "asyncpg>=0.30",
  "alembic>=1.17",
  "pgvector>=0.4",
  "argon2-cffi>=25.1",
  "cryptography>=46",
  "structlog>=25.4",
  "httpx>=0.28",
  "anthropic>=2.8",
  "openai>=3.49",
  "croniter>=6.0",
  "python-multipart>=0.0.20",
  "beautifulsoup4>=4.13",
  "playwright==1.63.0",
  "pocketsphinx>=5.0",
  "email-validator>=2.3.0",
  "pyotp>=2.10.0",
  "segno>=1.6.6",
  "pywebpush>=2.5.0",
]

[dependency-groups]
dev = [
  "pytest>=8.4",
  "pytest-asyncio>=1.2",
  "respx>=0.22",
  "ruff>=0.14",
  "mypy>=1.18",
  "pip-audit>=2.9",
  "aiosmtpd>=1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jarvis"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:pocketsphinx.*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101", "B008", "S311", "ASYNC109"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108"]
