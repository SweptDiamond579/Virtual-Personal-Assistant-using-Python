[package]
name = "jarvis-desktop-policy"
version = "0.1.0"
description = "Local policy, path validation, audit log and native action implementations for the JARVIS OS desktop companion (no Tauri dependency)."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }

[dev-dependencies]
tempfile = "3"
