[workspace]
members = [".", "crates/policy"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.80"
license = "MIT"

[package]
name = "jarvis-desktop"
version = "0.1.0"
description = "JARVIS OS desktop companion: loads the JARVIS web UI and executes locally-allowlisted native actions."
default-run = "jarvis-desktop"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "jarvis-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
jarvis-desktop-policy = { path = "crates/policy" }
# No plugins on purpose: no shell, fs, opener or dialog. Devtools are only
# available in debug builds (the `devtools` feature is NOT enabled).
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
tauri-utils = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
